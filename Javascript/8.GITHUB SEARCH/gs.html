<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Practice</title>
    <script src="gs.js" defer></script>
    <link rel="stylesheet" href="gs.css">
</head>
<body>

        <h1>GITHUB SEARCH</h1>
        <form action="" method="get">
            <input id ="searchInput" type="text" placeholder="Enter Github Username"><br><br>
            <button id="searchBtn">Search</button>
            <div id="result">
                <div class="user-card">
                    <img src="user.avatar_url" alt="user-profile" width="180">
                    <div>
                        <h2>${user.name} || ${user.login}</h2>
                    </div>
                </div> </div>
        </form>

        
</body>
</html>
